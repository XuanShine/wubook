[project]
name = "wubook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "loguru>=0.7",
    "nicegui>=3.18.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["booking"]
py-modules = [
    "fetching_reservations",
    "handling_prices",
    "handling_rooms",
    "updating_availability",
    "wubook_api",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
